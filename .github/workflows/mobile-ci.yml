name: Mobile CI

on:
  push:
    branches: [main, feat/mobile-ios-android]
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'packages/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  verify:
    name: Test + Analyze + Android arm64/iOS build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify debug APK contains only arm64-v8a native libraries
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ { print $2 }' | sort -u)"
          echo "Native ABIs in APK:"
          printf '%s\n' "$ABIS"
          if [[ "$ABIS" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries." >&2
            exit 1
          fi

      - name: Build iOS simulator app
        run: flutter build ios --simulator

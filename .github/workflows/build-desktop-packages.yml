name: Build Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  release_meta:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve or create release tag
        id: meta
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          TAG="v${VERSION_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" \
             && "${GITHUB_REF}" == "refs/heads/main" \
             && "${COMMIT_MESSAGE}" == "release: ${TAG}" ]]; then
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_SHA="$(git rev-list -n 1 "${TAG}")"
              if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
                echo "Tag ${TAG} already exists at ${TAG_SHA}, expected ${GITHUB_SHA}." >&2
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "${TAG}" "${GITHUB_SHA}"
              git push origin "${TAG}"
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux (.deb + .rpm)
    needs: release_meta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            patchelf \
            rpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package DEB
        run: bash scripts/build_linux_deb.sh --skip-build

      - name: Package RPM
        run: bash scripts/build_linux_rpm.sh --skip-build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: plume-pdf-linux-${{ github.run_number }}
          path: |
            build/linux/x64/release/*.deb
            build/linux/x64/release/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (.exe)
    needs: release_meta
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\windows\installer\build_installer.ps1 -SkipBuild

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: plume-pdf-windows-${{ github.run_number }}
          path: windows/installer/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS (.dmg)
    needs: release_meta
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG
        run: bash scripts/build_macos_dmg.sh --skip-build

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: plume-pdf-macos-${{ github.run_number }}
          path: build/macos/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android release APK (arm64-v8a)
    needs: release_meta
    if: needs.release_meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.release_meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK contains only arm64-v8a native libraries
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ { print $2 }' | sort -u)"
          echo "Native ABIs in APK:"
          printf '%s\n' "$ABIS"
          if [[ "$ABIS" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries." >&2
            exit 1
          fi

      - name: Prepare Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "plume-pdf-android-arm64-v8a-${RELEASE_TAG}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: plume-pdf-android-arm64-v8a-${{ needs.release_meta.outputs.tag }}
          path: plume-pdf-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: needs.release_meta.outputs.is_release == 'true'
    needs: [release_meta, linux, windows, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release_meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${RELEASE_TAG#v}"
          awk -v ver="$TAG" '
            index($0, "## " ver " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${RELEASE_TAG}" > RELEASE_NOTES.md
          fi

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            dist/* \
          || gh release upload "${RELEASE_TAG}" dist/* --clobber
